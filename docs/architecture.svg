<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">ai-hub 独立项目架构</title><desc id="desc">电脑浏览器与微信小程序通过各自前端访问独立的 Java 21 Spring Boot 服务，服务读写本地 JSON；项目间不共享数据，底部是构建和测试流水线。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f9fd"/><stop offset="1" stop-color="#eaf7f4"/></linearGradient><linearGradient id="dark" x2="1" y2="1"><stop stop-color="#103653"/><stop offset="1" stop-color="#0e5b66"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#0c927e"/><stop offset="1" stop-color="#1ab8a0"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1d4d65" flood-opacity=".11"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#65a6b4" stroke-width="1.8"/></marker></defs>
<rect width="1400" height="760" rx="24" fill="url(#bg)"/><rect x="30" y="30" width="1340" height="700" rx="24" fill="#fff" stroke="#dcebec"/>
<rect x="30" y="30" width="1340" height="104" rx="24" fill="url(#dark)"/><rect x="30" y="108" width="1340" height="26" fill="url(#dark)"/><circle cx="75" cy="82" r="7" fill="#67e5c2"/><text x="98" y="88" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#91dece" font-weight="700">AI-HUB / SYSTEM DESIGN</text><text x="920" y="90" font-family="Arial,sans-serif" font-size="16" fill="#d4e9ef">98 INDEPENDENT APPS  ·  1 CONSISTENT STACK</text>
<g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="70" y="188" font-size="25" fill="#133951" font-weight="700">一套技术语言，九十八个独立业务空间</text><text x="70" y="217" font-size="15" fill="#678396">按需启动单个项目；前后端、端口与数据文件相互隔离，不依赖公共服务。</text>
<rect x="68" y="255" width="238" height="286" rx="20" fill="#f5f9fc" stroke="#dae8ee"/><text x="91" y="292" font-size="12" fill="#7795a4" font-weight="700" letter-spacing="2">01 / EXPERIENCE</text><text x="91" y="332" font-size="24" fill="#133951" font-weight="700">用户入口</text><rect x="90" y="360" width="194" height="66" rx="12" fill="#fff" stroke="#dcebef"/><rect x="104" y="374" width="38" height="38" rx="9" fill="#e0f4ed"/><text x="113" y="400" font-size="23" fill="#0d8f77">▣</text><text x="152" y="387" font-size="15" fill="#173e51" font-weight="700">电脑浏览器</text><text x="152" y="406" font-size="11" fill="#819aa6">桌面端业务页面</text><rect x="90" y="440" width="194" height="66" rx="12" fill="#fff" stroke="#dcebef"/><rect x="104" y="454" width="38" height="38" rx="9" fill="#e7efff"/><text x="113" y="481" font-size="22" fill="#5483d7">◈</text><text x="152" y="467" font-size="15" fill="#173e51" font-weight="700">小程序预览</text><text x="152" y="487" font-size="11" fill="#819aa6">shop / barber / dining / selfshop</text>
<rect x="364" y="255" width="280" height="286" rx="20" fill="#f5fbfa" stroke="#d5ebe6"/><text x="388" y="292" font-size="12" fill="#569485" font-weight="700" letter-spacing="2">02 / PRESENTATION</text><text x="388" y="332" font-size="24" fill="#133951" font-weight="700">Vue 3 交互层</text><rect x="386" y="360" width="236" height="66" rx="12" fill="#fff" stroke="#d9eae7"/><text x="405" y="385" font-size="16" fill="#0d826f" font-weight="700">Web · Vite</text><text x="405" y="406" font-size="12" fill="#718d98">页面、表单、状态与筛选</text><rect x="386" y="440" width="236" height="66" rx="12" fill="#fff" stroke="#d9eae7"/><text x="405" y="465" font-size="16" fill="#3d7bba" font-weight="700">Mini · uni-app</text><text x="405" y="486" font-size="12" fill="#718d98">微信小程序构建产物</text>
<rect x="704" y="255" width="322" height="286" rx="20" fill="url(#dark)" filter="url(#shadow)"/><text x="730" y="292" font-size="12" fill="#95d7d5" font-weight="700" letter-spacing="2">03 / APPLICATION</text><text x="730" y="332" font-size="24" fill="#fff" font-weight="700">Java 21 · Spring Boot</text><text x="730" y="370" font-size="14" fill="#c0dfe5">REST API  /  领域校验  /  状态流转</text><path d="M730 392h270" stroke="#4f8b99"/><text x="730" y="427" font-size="14" fill="#d8f2f2">Web 静态资源打包进可执行 jar</text><text x="730" y="455" font-size="14" fill="#d8f2f2">每个项目独立端口与服务进程</text><rect x="730" y="478" width="261" height="38" rx="10" fill="#1e6c74"/><text x="749" y="503" font-size="13" fill="#d7fff2" font-weight="700">127.0.0.1 · LOCAL ONLY</text>
<rect x="1086" y="255" width="245" height="286" rx="20" fill="#f7f8fc" stroke="#e2e6f0"/><text x="1110" y="292" font-size="12" fill="#8382a2" font-weight="700" letter-spacing="2">04 / PERSISTENCE</text><text x="1110" y="332" font-size="24" fill="#133951" font-weight="700">本地 JSON</text><rect x="1108" y="357" width="201" height="82" rx="12" fill="#fff" stroke="#e5e7f0"/><text x="1126" y="385" font-size="15" fill="#635faa" font-weight="700">data/&lt;项目&gt;.json</text><text x="1126" y="409" font-size="12" fill="#7a8d9b">重启保留 · 手动备份</text><text x="1110" y="473" font-size="13" fill="#6c8190">无跨项目共享数据库</text><text x="1110" y="498" font-size="13" fill="#6c8190">单进程访问数据文件</text>
<path d="M309 398h52M647 398h54M1029 398h53" fill="none" stroke="#65a6b4" stroke-width="3" marker-end="url(#arrow)"/><text x="659" y="379" font-size="11" fill="#578a97">JSON API</text>
<rect x="68" y="578" width="1263" height="105" rx="18" fill="#eff7f8" stroke="#d8e8e9"/><text x="92" y="613" font-size="12" fill="#58908e" font-weight="700" letter-spacing="2">DELIVERY PIPELINE</text><text x="92" y="651" font-size="15" fill="#244b5e" font-weight="700">npm ci</text><text x="212" y="651" font-size="20" fill="#7faab3">→</text><text x="257" y="651" font-size="15" fill="#244b5e" font-weight="700">Vite / uni-app 构建</text><text x="476" y="651" font-size="20" fill="#7faab3">→</text><text x="522" y="651" font-size="15" fill="#244b5e" font-weight="700">Maven 测试 + 打包</text><text x="735" y="651" font-size="20" fill="#7faab3">→</text><text x="779" y="651" font-size="15" fill="#244b5e" font-weight="700">独立 jar / 小程序产物</text><text x="1032" y="651" font-size="20" fill="#7faab3">→</text><text x="1074" y="651" font-size="15" fill="#0b8975" font-weight="700">真实进程冒烟</text></g>
</svg>
