<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="970" viewBox="0 0 1400 970" role="img" aria-labelledby="title desc">
<title id="title">ai-hub 生态矩阵</title>
<desc id="desc">四类业务路径与安全身份试点：业务流程、微信小程序、行业记录样板、创意工具；安全中心目前仅供管理后台接口试点接入。</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090E23"/><stop offset=".52" stop-color="#111A3D"/><stop offset="1" stop-color="#0C273E"/></linearGradient>
  <linearGradient id="a" x2="1" y2="1"><stop stop-color="#77E8DE"/><stop offset="1" stop-color="#58A7FF"/></linearGradient>
  <linearGradient id="b" x2="1" y2="1"><stop stop-color="#A69BFF"/><stop offset="1" stop-color="#F092C2"/></linearGradient>
  <linearGradient id="c" x2="1" y2="1"><stop stop-color="#FFCB85"/><stop offset="1" stop-color="#FC8E8E"/></linearGradient>
  <linearGradient id="d" x2="1" y2="1"><stop stop-color="#81E6B5"/><stop offset="1" stop-color="#66BCF7"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="62"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020716" flood-opacity=".35"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9DCEF8" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1400" height="970" rx="30" fill="url(#bg)"/>
<rect width="1400" height="970" rx="30" fill="url(#grid)"/>
<circle cx="1235" cy="78" r="170" fill="#476AFF" opacity=".19" filter="url(#glow)"/>
<circle cx="77" cy="780" r="185" fill="#2DE6C5" opacity=".11" filter="url(#glow)"/>
<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
  <rect x="48" y="37" width="205" height="31" rx="15.5" fill="#213653" stroke="#436987"/>
  <circle cx="67" cy="53" r="4" fill="#6AEED5"/>
  <text x="80" y="58" font-size="13" font-weight="700" letter-spacing="2" fill="#B3EADD">生态全景</text>
  <text x="48" y="119" font-size="45" font-weight="800" fill="#FFFFFF">ai-hub 生态矩阵</text>
  <text x="50" y="153" font-size="17" fill="#A9BBD4">一个合集 · 四条业务路径 + 安全试点 · 独立运行</text>

  <g filter="url(#shadow)">
    <rect x="48" y="185" width="638" height="273" rx="24" fill="#192541" stroke="#426077"/>
    <rect x="714" y="185" width="638" height="273" rx="24" fill="#201F43" stroke="#655380"/>
    <rect x="48" y="482" width="638" height="273" rx="24" fill="#30283B" stroke="#735E6A"/>
    <rect x="714" y="482" width="638" height="273" rx="24" fill="#192C39" stroke="#476C6C"/>
  </g>
  <rect x="48" y="185" width="638" height="5" rx="3" fill="url(#a)"/>
  <rect x="714" y="185" width="638" height="5" rx="3" fill="url(#b)"/>
  <rect x="48" y="482" width="638" height="5" rx="3" fill="url(#c)"/>
  <rect x="714" y="482" width="638" height="5" rx="3" fill="url(#d)"/>

  <text x="77" y="225" font-size="14" font-weight="800" letter-spacing="2" fill="#8FE8E0">01 / 业务流程应用</text>
  <text x="77" y="269" font-size="31" font-weight="800" fill="#F7FAFF">精选业务体验</text>
  <text x="77" y="304" font-size="16" fill="#B9CDE1">从商品交易到后台管理，体验有侧重的业务路径。</text>
  <rect x="77" y="328" width="575" height="94" rx="15" fill="#101D35" stroke="#35526A"/>
  <text x="97" y="357" font-size="17" font-weight="700" fill="#91E7E6">商城</text><text x="225" y="357" font-size="15" fill="#D7E5F4">商品 · 购物车 · 订单</text>
  <text x="97" y="385" font-size="17" font-weight="700" fill="#91E7E6">管理后台</text><text x="225" y="385" font-size="15" fill="#D7E5F4">控制台 · 用户 · 角色</text>
  <text x="97" y="411" font-size="17" font-weight="700" fill="#91E7E6">实验记录</text><text x="225" y="411" font-size="15" fill="#D7E5F4">实验 · 修订 · 导出</text>

  <text x="743" y="225" font-size="14" font-weight="800" letter-spacing="2" fill="#CAB0FF">02 / 移动端触点</text>
  <text x="743" y="269" font-size="31" font-weight="800" fill="#F7FAFF">微信小程序</text>
  <text x="743" y="304" font-size="16" fill="#CEC6E2">四个小程序构建，对接各自的后端服务。</text>
  <rect x="743" y="329" width="575" height="94" rx="15" fill="#191933" stroke="#584971"/>
  <text x="765" y="362" font-size="19" font-weight="700" fill="#E2D3FF">商城</text>
  <text x="925" y="362" font-size="19" font-weight="700" fill="#E2D3FF">理发</text>
  <text x="1090" y="362" font-size="19" font-weight="700" fill="#E2D3FF">点餐</text>
  <text x="765" y="400" font-size="19" font-weight="700" fill="#E2D3FF">自助购物</text>
  <text x="925" y="400" font-size="14" fill="#CEC6E2">四个构建目标，已包含在一百零二个项目中</text>

  <text x="77" y="522" font-size="14" font-weight="800" letter-spacing="2" fill="#FFD2A0">03 / 行业记录样板</text>
  <text x="77" y="566" font-size="31" font-weight="800" fill="#F7FAFF">持续扩展的行业地图</text>
  <text x="77" y="601" font-size="16" fill="#DDCCD1">本机记录、关联档案、搜索与表单。</text>
  <rect x="77" y="614" width="575" height="121" rx="15" fill="#241E32" stroke="#6A5465"/>
  <text x="97" y="643" font-size="17" font-weight="700" fill="#FFD6AD">景区地产</text><text x="240" y="643" font-size="15" fill="#F0DBDF">景区 · 房产 · 物业</text>
  <text x="97" y="671" font-size="17" font-weight="700" fill="#FFD6AD">民生健康</text><text x="240" y="671" font-size="15" fill="#F0DBDF">健康 · 学校 · 养老</text>
  <text x="97" y="699" font-size="17" font-weight="700" fill="#FFD6AD">经营运维</text><text x="240" y="699" font-size="15" fill="#F0DBDF">企业资源 · 物流 · 维修</text>
  <text x="97" y="727" font-size="17" font-weight="700" fill="#FFD6AD">质量协作</text><text x="240" y="727" font-size="15" fill="#F0DBDF">测试 · 工单 · 缺陷</text>

  <text x="743" y="522" font-size="14" font-weight="800" letter-spacing="2" fill="#A8F2CC">04 / 创意与效率工具</text>
  <text x="743" y="566" font-size="31" font-weight="800" fill="#F7FAFF">创造、探索与发现</text>
  <text x="743" y="601" font-size="16" fill="#BDDAD7">轻量工具，让创意先在本机跑起来。</text>
  <rect x="743" y="625" width="575" height="94" rx="15" fill="#112630" stroke="#426A64"/>
  <text x="763" y="656" font-size="17" font-weight="700" fill="#A9F0CD">智能工具</text><text x="892" y="656" font-size="15" fill="#DAECE8">命令行 · 技能 · 提示词</text>
  <text x="763" y="683" font-size="17" font-weight="700" fill="#A9F0CD">网页创意</text><text x="892" y="683" font-size="15" fill="#DAECE8">小游戏 · 黄页 · 工作台</text>
  <text x="763" y="710" font-size="17" font-weight="700" fill="#A9F0CD">网页采集</text><text x="892" y="710" font-size="15" fill="#DAECE8">公开页面信息提取</text>

  <rect x="48" y="781" width="1304" height="129" rx="23" fill="#121E36" stroke="#416078"/>
  <text x="77" y="817" font-size="14" font-weight="800" letter-spacing="2" fill="#78DBE9">独立运行 · 安全与身份中心仅对接管理后台接口（试点）</text>
  <text x="77" y="856" font-size="21" font-weight="700" fill="#F6FBFF">网页与小程序</text>
  <text x="314" y="856" font-size="22" fill="#78DBE9">→</text>
  <text x="352" y="856" font-size="21" font-weight="700" fill="#F6FBFF">后端服务</text>
  <text x="674" y="856" font-size="22" fill="#78DBE9">→</text>
  <text x="712" y="856" font-size="21" font-weight="700" fill="#F6FBFF">本机数据</text>
  <text x="861" y="856" font-size="22" fill="#78DBE9">→</text>
  <text x="900" y="856" font-size="21" font-weight="700" fill="#F6FBFF">测试与截图</text>
  <text x="78" y="885" font-size="15" fill="#9FB6D0">一百零二个可运行本机项目 · 功能深度各异 · 非生产级产品</text>
  <text x="49" y="947" font-size="14" letter-spacing="2" fill="#7F9EB7">ai-hub  /  从一个项目开始探索</text>
</g>
</svg>